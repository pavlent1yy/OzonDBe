[project]
name = "ozon-sync"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "apscheduler>=3.11,<4",
    "tzdata>=2026.5",
    "gspread>=6.1",
]

[project.scripts]
ozon-sync = "ozon_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
